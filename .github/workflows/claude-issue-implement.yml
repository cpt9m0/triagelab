name: Claude Issue Implementation

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]

jobs:
  implement:
    # issue_comment also fires on PR comments; github.event.issue.pull_request is only
    # set in that case, so this keeps the job to real issues.
    if: github.event_name == 'issues' || github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
