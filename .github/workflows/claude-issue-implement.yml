name: Claude Issue Implementation

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]

jobs:
  implement:
    # issue_comment also fires on PR comments (filtered via pull_request) and on the
    # bot's own status comments (filtered via comment.user.type) - without the latter
    # check, Claude's "finished" comment re-triggers this workflow on itself.
    if: >
      github.event_name == 'issues' ||
      (github.event.issue.pull_request == null && github.event.comment.user.type != 'Bot')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --allowedTools "Bash(uv sync:*),Bash(uv run pytest:*),Bash(uv run ruff:*)"
