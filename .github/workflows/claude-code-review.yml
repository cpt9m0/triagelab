name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "github-actions[bot]"
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} in this repository.

            1. Run `gh pr diff ${{ github.event.pull_request.number }}` to get the full diff.
            2. Use the Task tool to run the project's `code-reviewer` subagent
               (.claude/agents/code-reviewer.md), passing it the diff text from step 1 directly
               in the task prompt so it does not need to re-fetch it. The subagent checks
               correctness, dependency discipline, rule hygiene, the scoring test contract, and
               safety, per this project's CLAUDE.md.
            3. Post the subagent's findings:
               - For each finding that names a specific file and line, post one inline comment
                 there with the `mcp__github_inline_comment__create_inline_comment` tool.
               - Always finish with exactly one summary comment, posted with
                 `gh pr comment ${{ github.event.pull_request.number }} --body "..."`:
                 - If there were findings, briefly summarize how many and their severity.
                 - If the subagent reports the diff is clean, post exactly:
                   "## Code review\n\nNo issues found by the code-reviewer subagent (correctness,
                   dependency discipline, rule hygiene, test contract, safety). Safe to merge as
                   far as automated review can tell."

            Post at most one comment per finding. Every run must end with exactly one `gh pr
            comment` summary call, even if nothing else was found.
          claude_args: |
            --allowedTools "Task,Bash(gh pr diff:*),Bash(gh pr comment:*),mcp__github_inline_comment__create_inline_comment"
